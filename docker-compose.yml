services:
  rag-api:
    build: .
    container_name: ragnxus-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data/chroma_db
      - hf_cache:/root/.cache/huggingface
      - ./logs:/data/logs
      - ./memory:/app/memory
      # 以下路径按你的实际环境调整（HF 缓存 + Cross-Encoder 模型）
      # - C:\path\to\hf_cache:/root/.cache/huggingface
      # - C:\path\to\cross-encoder:/app/models/cross-encoder
    env_file:
      - .env
    environment:
      - RAG_CHROMA_DIR=/data/chroma_db
      - RAG_LOG_FILE=/data/logs/rag_api.log
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_DISABLE_SYMLINKS=1

  rag-frontend:
    image: ragnxus-frontend
    build: .
    container_name: ragnxus-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./rag_app.py:/app/rag_app.py
      - ./style.css:/app/style.css
      - ./.streamlit:/app/.streamlit
    env_file:
      - .env
    environment:
      - API_BASE=http://rag-api:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    depends_on:
      - rag-api
    command: ["streamlit", "run", "rag_app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  chroma_data:
  hf_cache:
