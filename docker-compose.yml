name: ragnxus

services:
  rag-api:
    build: .
    container_name: ragnxus-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/data/chroma_db
      - hf_cache:/root/.cache/huggingface
      - ./logs:/data/logs
      - ./rag_api.py:/app/rag_api.py
      - ./rag_multiagent.py:/app/rag_multiagent.py
      - ./memory:/app/memory
      # 以下路径按你的实际环境调整（HF 缓存 + Cross-Encoder 模型）
      # - C:\path\to\hf_cache:/root/.cache/huggingface
      # - C:\path\to\cross-encoder:/app/models/cross-encoder
    env_file:
      - .env
    environment:
      - RAG_CHROMA_DIR=/data/chroma_db
      - RAG_LOG_FILE=/data/logs/rag_api.log
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_DISABLE_SYMLINKS=1

  rag-frontend:
    build: ./frontend
    container_name: ragnxus-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - rag-api

volumes:
  hf_cache:
