name: ragnxus-smoke

services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn rag_api:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "127.0.0.1:18000:8000"
    tmpfs:
      - /data/chroma_db:size=256m
    environment:
      DEEPSEEK_API_KEY: smoke-placeholder-not-a-secret # pragma: allowlist secret -- non-routable test placeholder
      RAG_API_KEY: ${RAG_SMOKE_API_KEY:?RAG_SMOKE_API_KEY must be set by the smoke runner}
      RAG_CORS_ORIGINS: http://localhost:5173
      RAG_RATE_LIMIT: 6
      RAG_CHROMA_DIR: /data/chroma_db
      RAG_EMBEDDING_POOLING: masked_mean
      RAG_LOG_FILE: /tmp/rag_api.log
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert data['status']=='ok'"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 40s

  rag-frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      rag-api:
        condition: service_healthy
