worker_processes 1;
events { worker_connections 1024; }

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理 → 后端（兼容 /api/ 前缀）
    location /api/ {
      proxy_pass http://rag-api:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    # 最终版前端 API_BASE="" 同源请求：/health /query /doc /kb /agent 原样转发
    location ~ ^/(health|query|doc|kb|agent)(/|$) {
      proxy_pass http://rag-api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      # SSE 流式（/query/stream）需要关 buffering，否则打字动画不出现
      proxy_buffering off;
      proxy_cache off;
    }

    # 前端路由（React SPA，所有非 API 路径返回 index.html）
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
